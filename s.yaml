edition: 3.0.0
name: kaishu-compliance
access: 'default'

services:
  kaishu-fc:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: kaishu-compliance
      description: '凯叔讲故事廉洁举报平台'
      runtime: nodejs18
      handler: server.handler
      memorySize: 512
      timeout: 30
      instanceConcurrency: 1
      environmentVariables:
        NODE_ENV: production
        SUPABASE_URL: ${env.SUPABASE_URL}
        SUPABASE_KEY: ${env.SUPABASE_KEY}
        SESSION_SECRET: ${env.SESSION_SECRET}
        REPORTER_DATA_KEY: ${env.REPORTER_DATA_KEY}
        QUERY_CODE_PEPPER: ${env.QUERY_CODE_PEPPER}
      codeUri: ./
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - HEAD
              - OPTIONS
